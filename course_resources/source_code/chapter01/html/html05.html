<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
</head>
<body>
<form action="#" method="get">
    <h3>用户注册</h3>
    <!--文本输入框表单项-->
    用户名：<input type="text" name="username"/> <br/><br/>
    <!--密码输入框表单项-->
    密&nbsp;&nbsp;&nbsp;&nbsp;码：<input type="password"
                                        name="password"/> <br/><br/>
    <!--单选框表单项-->
    性别：
    <input type="radio" name="sex" value="m"/>男
    <input type="radio" name="sex" value="f"/>女 <br/><br/>
    <!--复选框表单项-->
    兴趣爱好：
    <input type="checkbox" name="hobby" value="read"/>阅读
    <input type="checkbox" name="hobby" value="swim"/>游泳
    <input type="checkbox" name="hobby" value="basketball"/>篮球
    <br/><br/>
    <!--文件选择表单项-->
    头像：<input type="file" name="file"/> <br/><br/>
    学历：
    <select name="education">
        <option value="high">高中及以下</option>
        <option value="college">专科</option>
        <option value="bachelor">本科</option>
        <option value="master">研究生及以上</option>
    </select>
    <br/><br/>
    个人简介：<br/>
    <textarea content="" name="message" rows="6" cols="50">
                </textarea><br/><br/>
    <input type="submit" value="注册"/>
    <button type="reset">重置</button>
</form>
</body>
</html>
