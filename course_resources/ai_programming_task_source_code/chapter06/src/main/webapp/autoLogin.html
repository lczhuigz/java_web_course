<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<h3>用户登录</h3>
<body>
<form action="http://localhost:8080/chapter06/autoLogin"
      method="post">
    <table border="1">
        <tr>
            <td>用户名：</td>
            <td>&nbsp;&nbsp;<input type="text" name="username"/>
        </tr>
        <tr>
            <td>密&nbsp; 码：</td>
            <td>&nbsp;&nbsp;<input type="password" name="password"/>
        </tr>
        <tr>
            <td>自动登录时间</td>
            <td>
			<input type="radio" name="autologin"
                       value="no" checked/>不自动登录
			<input type="radio" name="autologin"
                       value="oneWeek"/>一周
                <input type="radio" name="autologin"
                       value="oneMonth"/>一个月
                <input type="radio" name="autologin"
                       value="threeMonths"/>三个月
            </td>
        </tr>
        <tr>
            <td colspan="2" style="text-align: center">
                <input type="submit" value="登录" />
                <input type="reset" value="重置" />
            </td>
        </tr>
    </table>
</form>
</body>
<html>
