<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <script src="axios.min.js"></script>
    <script>
        function checkUsernameAvailability() {
            const username = document.getElementById('username').value;
            axios.get('CheckUsernameServlet', { params: { username: username } })
                .then(function (response) {
                    const message = response.data.message;
                    document.getElementById('usernameMessage').innerText = message;
                })
                .catch(function (error) {
                    console.log(error);
                    document.getElementById('usernameMessage').innerText = 'Error checking username availability';
                });
        }
    </script>
</head>
<body>
    <form>
        <label for="username">用户名:</label>
        <input type="text" id="username" name="username" onblur="checkUsernameAvailability()">
        <span id="usernameMessage"></span>
        <br>
        <label for="password">密码:</label>
        <input type="password" id="password" name="password">
        <br>
        <input type="submit" value="注册">
    </form>
</body>
</html>
