<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人信息</title>
    <style>
        body { font-family: "微软雅黑", sans-serif; background: #f0f2f5; }
        .box { width: 480px; margin: 100px auto; padding: 30px;
            background: #fff; border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0,0,0,.15); }
        li { line-height: 2; }
    </style>
</head>
<body>
<div class="box">
    <h2>个人信息（需登录才能访问）</h2>
    <ul>
        <li>用户名：<span id="user">...</span></li>
        <li>角色：管理员</li>
        <li>登录方式：Session 已认证</li>
    </ul>
    <a href="welcome.html">返回主页</a>
</div>

<script>
    fetch('userinfo')
        .then(function (r) { return r.json(); })
        .then(function (data) {
            if (data.code !== 200) { location.href = 'login.html?error=needLogin'; return; }
            document.getElementById('user').textContent = data.user;
        });
</script>
</body>
</html>
