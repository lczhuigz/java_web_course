<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>主页</title>
    <style>
        body { font-family: "微软雅黑", sans-serif; background: #f0f2f5; }
        .box { width: 560px; margin: 100px auto; padding: 30px;
            background: #fff; border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0,0,0,.15); }
        h2 { color: #1677ff; }
        .info { line-height: 2; color: #555; }
        a.btn { display: inline-block; margin-top: 16px; padding: 8px 18px;
            background: #1677ff; color: #fff; border-radius: 4px;
            text-decoration: none; margin-right: 10px; }
        a.btn:hover { background: #0958d9; }
    </style>
</head>
<body>
<div class="box">
    <h2>欢迎你，<span id="user">...</span>！</h2>
    <div class="info">
        <p>Session ID：<span id="sessionId"></span></p>
        <p>Session 创建时间：<span id="createTime"></span></p>
        <p>Session 最后访问时间：<span id="lastTime"></span></p>
        <p>Session 最大不活动间隔：<span id="maxInactive"></span> 秒</p>
    </div>
    <a class="btn" href="info.html">查看个人信息</a>
    <a class="btn" href="logout">退出登录</a>
</div>

<script>
    // 异步获取当前登录信息并填充页面
    fetch('userinfo')
        .then(function (r) { return r.json(); })
        .then(function (data) {
            if (data.code !== 200) { location.href = 'login.html?error=needLogin'; return; }
            document.getElementById('user').textContent        = data.user;
            document.getElementById('sessionId').textContent   = data.sessionId;
            document.getElementById('createTime').textContent  = data.createTime;
            document.getElementById('lastTime').textContent    = data.lastTime;
            document.getElementById('maxInactive').textContent = data.maxInactive;
        });
</script>
</body>
</html>
